<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>martinunderscoreclark — audio archive</title>
<style>
  :root { --bg:#12141a; --panel:#1c2030; --line:#2c3348; --text:#e8ebf4; --muted:#8b93a7; --accent:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px 8px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
  h1 { margin:0; font-size:20px; }
  a { color:var(--accent); }
  .status { color:var(--muted); font-size:13px; }
  .now { margin:12px 24px 18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .now h2 { margin:0 0 4px; font-size:18px; }
  .artist { color:var(--muted); margin-bottom:12px; }
  audio { width:100%; }
  .controls { display:flex; gap:8px; margin-top:10px; }
  button { background:#2a3148; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  ul { list-style:none; margin:0; padding:0 24px 40px; }
  li { display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  li.active { background:#232a40; border-radius:8px; }
  .idx, .meta small { color:var(--muted); }
  .meta small { display:block; }
  .embed iframe, .embed embed { width:100%; border:0; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>martinunderscoreclark audio archive</h1>
    <div class="status" id="status">Loading posts…</div>
  </div>
  <a href="https://martinunderscoreclark.tumblr.com/archive/filter-by/audio" target="_blank" rel="noopener">Open archive</a>
</header>
<section class="now">
  <h2 id="title">—</h2>
  <div class="artist" id="artist"></div>
  <audio id="player" controls preload="none"></audio>
  <div class="controls">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
  </div>
  <div class="embed" id="embed"></div>
</section>
<ul id="list"></ul>
<script>
const BLOG = "martinunderscoreclark.tumblr.com";
const PLEAD = "plead=please-dont-download-this-or-our-lawyers-wont-let-us-host-audio";
const player = document.getElementById("player");
const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const artistEl = document.getElementById("artist");
const embedEl = document.getElementById("embed");
const statusEl = document.getElementById("status");
let tracks = [];
let index = 0;

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function loadPage(start) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    let settled = false;
    const timer = setTimeout(() => finish(new Error("Tumblr API timed out")), 20000);
    function finish(err, data) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      s.remove();
      if (err) reject(err);
      else resolve(data);
    }
    s.onload = () => {
      const data = window.tumblr_api_read;
      window.tumblr_api_read = undefined;
      if (!data || !data.posts) finish(new Error("Tumblr API returned no posts"));
      else finish(null, data);
    };
    s.onerror = () => finish(new Error("Could not load Tumblr API"));
    s.src = `https://${BLOG}/api/read/json?type=audio&num=50&start=${start}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

function strip(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function withPlead(url) {
  if (!url) return null;
  if (url.startsWith("//")) url = "https:" + url;
  try { url = decodeURIComponent(url); } catch (_) {}
  if (!/^https?:/i.test(url)) return null;
  if (/[?&]plead=/.test(url)) return url;
  return url + (url.includes("?") ? "&" : "?") + PLEAD;
}

function audioUrl(post) {
  const blob = `${post["audio-embed"] || ""} ${post["audio-player"] || ""}`;
  const candidates = [];
  const src = blob.match(/src=["']([^"']+)["']/i);
  if (src) {
    const raw = src[1].startsWith("//") ? "https:" + src[1] : src[1];
    try {
      const file = new URL(raw).searchParams.get("audio_file");
      if (file) candidates.push(file);
    } catch (_) {}
  }
  const loose = blob.match(/audio_file=([^"'&\s]+)/i);
  if (loose) candidates.push(loose[1]);
  const mp3 = blob.match(/https?:[^"'>\s]+\.mp3/i);
  if (mp3) candidates.push(mp3[0]);
  return withPlead(candidates[0] || null);
}

function normalize(post) {
  return {
    id: String(post.id),
    title: post["id3-title"] || strip(post["audio-caption"]).slice(0, 140) || "Untitled",
    artist: post["id3-artist"] || "",
    album: post["id3-album"] || "",
    date: post["date-gmt"] || post.date || "",
    url: post["url-with-slug"] || post.url || "",
    file: audioUrl(post),
    embed: post["audio-embed"] || post["audio-player"] || ""
  };
}

async function loadAll() {
  const seen = new Set();
  let start = 0;
  let total = Infinity;
  while (start < total) {
    let data;
    try {
      data = await loadPage(start);
    } catch (err) {
      if (tracks.length) {
        statusEl.textContent = `Stopped at ${tracks.length}: ${err.message}`;
        return;
      }
      throw err;
    }
    const posts = data.posts || [];
    if (!posts.length) break;
    total = Number(data["posts-total"] || total);
    for (const post of posts) {
      const t = normalize(post);
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      tracks.push(t);
    }
    start += posts.length;
    statusEl.textContent = `Loaded ${tracks.length}${Number.isFinite(total) ? " of " + total : ""}`;
    if (posts.length < 50) break;
    await sleep(400);
  }
}

function renderList() {
  listEl.innerHTML = "";
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.dataset.i = String(i);
    const strong = document.createElement("strong");
    strong.textContent = t.title;
    const small = document.createElement("small");
    small.textContent = [t.artist, t.album, t.date].filter(Boolean).join(" · ");
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.append(strong, small);
    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);
    const kind = document.createElement("span");
    kind.className = "idx";
    kind.textContent = t.file ? "mp3" : "embed";
    li.append(idx, meta, kind);
    li.onclick = () => play(i, true);
    listEl.appendChild(li);
  });
}

function showEmbed(t) {
  embedEl.innerHTML = t.embed || "";
  if (!embedEl.innerHTML && t.url) {
    const a = document.createElement("a");
    a.href = t.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Open post";
    embedEl.append(a);
  }
}

function play(i, fromClick) {
  if (!tracks.length) return;
  index = (i + tracks.length) % tracks.length;
  const t = tracks[index];
  titleEl.textContent = t.title;
  artistEl.textContent = [t.artist, t.album].filter(Boolean).join(" — ");
  embedEl.innerHTML = "";
  [...listEl.children].forEach((li) => li.classList.toggle("active", Number(li.dataset.i) === index));
  if (t.file) {
    player.src = t.file;
    if (fromClick) player.play().catch(() => showEmbed(t));
  } else {
    player.removeAttribute("src");
    player.load();
    showEmbed(t);
  }
}

player.addEventListener("error", () => showEmbed(tracks[index] || {}));
player.addEventListener("ended", () => play(index + 1, true));
document.getElementById("prev").onclick = () => play(index - 1, true);
document.getElementById("next").onclick = () => play(index + 1, true);

loadAll().then(() => {
  statusEl.textContent = tracks.length
    ? `${tracks.length} tracks — click one to play`
    : "No audio posts returned";
  renderList();
  if (tracks.length) play(0, false);
}).catch((err) => {
  statusEl.textContent = err.message;
});
</script>
</body>
</html>
