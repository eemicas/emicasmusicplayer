<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>martinunderscoreclark — audio archive</title>
<style>
  :root { --bg:#12141a; --panel:#1c2030; --line:#2c3348; --text:#e8ebf4; --muted:#8b93a7; --accent:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px 8px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
  h1 { margin:0; font-size:20px; }
  a { color:var(--accent); }
  .status { color:var(--muted); font-size:13px; }
  .now { margin:12px 24px 18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; grid-template-columns:88px 1fr; gap:14px; }
  .now img { width:88px; height:88px; object-fit:cover; border-radius:8px; background:#2a3148; }
  .now h2 { margin:0 0 4px; font-size:18px; }
  .artist { color:var(--muted); margin-bottom:12px; }
  audio { width:100%; }
  .controls { display:flex; gap:8px; margin-top:10px; }
  button { background:#2a3148; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  ul { list-style:none; margin:0; padding:0 24px 40px; }
  li { display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  li.active { background:#232a40; border-radius:8px; }
  .idx, .meta small { color:var(--muted); }
  .meta small { display:block; }
  .embed iframe { width:100%; border:0; margin-top:10px; }
  @media (max-width:640px) { .now { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>martinunderscoreclark audio archive</h1>
    <div class="status" id="status">Loading posts…</div>
  </div>
  <a href="https://martinunderscoreclark.tumblr.com/archive/filter-by/audio" target="_blank" rel="noopener">Open archive</a>
</header>
<section class="now">
  <img id="art" alt="">
  <div>
    <h2 id="title">—</h2>
    <div class="artist" id="artist"></div>
    <audio id="player" controls preload="none"></audio>
    <div class="controls">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
    <div class="embed" id="embed"></div>
  </div>
</section>
<ul id="list"></ul>
<script>
const BLOG = "martinunderscoreclark.tumblr.com";
const KEY = "fuiKNFp9vQFvjLNvx4sUwti4Yb5yGutBN4Xh10LXZhhRKjWlV4";
const PLEAD = "plead=please-dont-download-this-or-our-lawyers-wont-let-us-host-audio";
const player = document.getElementById("player");
const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const artistEl = document.getElementById("artist");
const embedEl = document.getElementById("embed");
const artEl = document.getElementById("art");
const statusEl = document.getElementById("status");
let tracks = [];
let index = 0;

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function loadPage(offset) {
  const cb = "tumblrV2_" + offset + "_" + Date.now();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    let settled = false;
    const timer = setTimeout(() => finish(new Error("Tumblr API timed out")), 20000);
    function finish(err, data) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      delete window[cb];
      s.remove();
      if (err) reject(err);
      else resolve(data);
    }
    window[cb] = (data) => finish(null, data);
    s.onerror = () => finish(new Error("Could not load Tumblr API"));
    s.src = "https://api.tumblr.com/v2/blog/" + BLOG + "/posts?api_key=" + KEY +
      "&type=audio&limit=20&offset=" + offset + "&jsonp=" + cb;
    document.head.appendChild(s);
  });
}

function strip(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function withPlead(url) {
  if (!url) return null;
  if (/[?&]plead=/.test(url)) return url;
  return url + (url.includes("?") ? "&" : "?") + PLEAD;
}

function normalize(post) {
  return {
    id: String(post.id_string || post.id),
    title: post.track_name || strip(post.summary || post.caption).slice(0, 140) || "Untitled",
    artist: post.artist || "",
    album: post.album || "",
    art: post.album_art || "",
    date: post.date || "",
    url: post.post_url || "",
    file: withPlead(post.audio_url || post.audio_source_url || null),
    embed: post.player || post.embed || ""
  };
}

async function loadAll() {
  const seen = new Set();
  let offset = 0;
  let total = Infinity;
  while (offset < total) {
    const data = await loadPage(offset);
    if (!data || !data.meta || data.meta.status !== 200) {
      throw new Error((data && data.meta && data.meta.msg) || "Tumblr API rejected the request");
    }
    const posts = (data.response && data.response.posts) || [];
    total = Number((data.response && data.response.total_posts) || total);
    if (!posts.length) break;
    for (const post of posts) {
      const t = normalize(post);
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      tracks.push(t);
    }
    offset += posts.length;
    statusEl.textContent = "Loaded " + tracks.length + (Number.isFinite(total) ? " of " + total : "");
    if (posts.length < 20) break;
    await sleep(300);
  }
}

function renderList() {
  listEl.innerHTML = "";
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.dataset.i = String(i);
    const strong = document.createElement("strong");
    strong.textContent = t.title;
    const small = document.createElement("small");
    small.textContent = [t.artist, t.album].filter(Boolean).join(" · ");
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.append(strong, small);
    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1);
    const kind = document.createElement("span");
    kind.className = "idx";
    kind.textContent = t.file ? "mp3" : "embed";
    li.append(idx, meta, kind);
    li.onclick = () => play(i, true);
    listEl.appendChild(li);
  });
}

function showEmbed(t) {
  embedEl.innerHTML = t.embed || "";
  if (!embedEl.innerHTML && t.url) {
    const a = document.createElement("a");
    a.href = t.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Open post";
    embedEl.append(a);
  }
}

function play(i, fromClick) {
  if (!tracks.length) return;
  index = (i + tracks.length) % tracks.length;
  const t = tracks[index];
  titleEl.textContent = t.title;
  artistEl.textContent = [t.artist, t.album].filter(Boolean).join(" — ");
  artEl.src = t.art || "";
  artEl.hidden = !t.art;
  embedEl.innerHTML = "";
  [...listEl.children].forEach((li) => li.classList.toggle("active", Number(li.dataset.i) === index));
  if (t.file) {
    player.src = t.file;
    if (fromClick) player.play().catch(() => showEmbed(t));
  } else {
    player.removeAttribute("src");
    player.load();
    showEmbed(t);
  }
}

player.addEventListener("error", () => showEmbed(tracks[index] || {}));
player.addEventListener("ended", () => play(index + 1, true));
document.getElementById("prev").onclick = () => play(index - 1, true);
document.getElementById("next").onclick = () => play(index + 1, true);

loadAll().then(() => {
  statusEl.textContent = tracks.length ? tracks.length + " tracks — click one to play" : "No audio posts returned";
  renderList();
  if (tracks.length) play(0, false);
}).catch((err) => {
  statusEl.textContent = err.message;
});
</script>
</body>
</html>
