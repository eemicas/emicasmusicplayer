<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>martinunderscoreclark — audio archive</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1c2030;
    --line: #2c3348;
    --text: #e8ebf4;
    --muted: #8b93a7;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px 8px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: end;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 650; }
  a { color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; }
  .now {
    margin: 12px 24px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .now h2 { margin: 0 0 4px; font-size: 18px; }
  .artist { color: var(--muted); margin-bottom: 12px; }
  audio { width: 100%; }
  .controls { display: flex; gap: 8px; margin-top: 10px; }
  button {
    background: #2a3148;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0 24px 40px; }
  li {
    display: grid;
    grid-template-columns: 42px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  li.active { background: #232a40; border-radius: 8px; }
  .idx { color: var(--muted); }
  .meta small { color: var(--muted); display: block; }
  .embed { margin-top: 10px; }
  .embed iframe { width: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>martinunderscoreclark audio archive</h1>
    <div class="status" id="status">Loading posts…</div>
  </div>
  <a href="https://martinunderscoreclark.tumblr.com/archive/filter-by/audio" target="_blank" rel="noopener">Open archive</a>
</header>
<section class="now">
  <h2 id="title">—</h2>
  <div class="artist" id="artist"></div>
  <audio id="player" controls preload="none"></audio>
  <div class="controls">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
  </div>
  <div class="embed" id="embed"></div>
</section>
<ul id="list"></ul>
<script>
const BLOG = "martinunderscoreclark.tumblr.com";
const player = document.getElementById("player");
const listEl = document.getElementById("list");
const titleEl = document.getElementById("title");
const artistEl = document.getElementById("artist");
const embedEl = document.getElementById("embed");
const statusEl = document.getElementById("status");
let tracks = [];
let index = 0;

function loadPage(start) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `https://${BLOG}/api/read/json?type=audio&num=50&start=${start}&_=${Date.now()}`;
    s.onload = () => {
      const data = window.tumblr_api_read;
      s.remove();
      resolve(data);
    };
    s.onerror = () => reject(new Error("Could not load Tumblr API"));
    document.head.appendChild(s);
  });
}

function strip(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function audioUrl(post) {
  const blob = `${post["audio-embed"] || ""} ${post["audio-player"] || ""} ${post["audio-caption"] || ""}`;
  const m = blob.match(/audio_file=([^"'&\s]+)/i) || blob.match(/https?:[^"'>\s]+\.mp3/i);
  if (!m) return null;
  let url = decodeURIComponent(m[1] || m[0]);
  if (url.startsWith("//")) url = "https:" + url;
  return url;
}

function normalize(post) {
  const title = post["id3-title"] || strip(post["audio-caption"]).slice(0, 120) || "Untitled";
  const artist = post["id3-artist"] || "";
  const album = post["id3-album"] || "";
  return {
    id: post.id,
    title,
    artist,
    album,
    date: post["date-gmt"] || post.date || "",
    url: post.url,
    file: audioUrl(post),
    embed: post["audio-embed"] || ""
  };
}

async function loadAll() {
  let start = 0;
  let total = Infinity;
  while (start < total) {
    const data = await loadPage(start);
    if (!data || !data.posts) break;
    total = Number(data["posts-total"] || 0);
    if (!data.posts.length) break;
    tracks.push(...data.posts.map(normalize));
    start += data.posts.length;
    statusEl.textContent = `Loaded ${tracks.length} of ${total || "?"} audio posts`;
    if (data.posts.length < 50) break;
  }
}

function renderList() {
  listEl.innerHTML = "";
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.dataset.i = i;
    li.innerHTML = `<span class="idx">${i + 1}</span>
      <span class="meta"><strong></strong><small></small></span>
      <span class="idx">${t.file ? "mp3" : "embed"}</span>`;
    li.querySelector("strong").textContent = t.title;
    li.querySelector("small").textContent = [t.artist, t.album, t.date].filter(Boolean).join(" · ");
    li.onclick = () => play(i);
    listEl.appendChild(li);
  });
}

function play(i) {
  if (!tracks.length) return;
  index = (i + tracks.length) % tracks.length;
  const t = tracks[index];
  titleEl.textContent = t.title;
  artistEl.textContent = [t.artist, t.album].filter(Boolean).join(" — ");
  embedEl.innerHTML = "";
  [...listEl.children].forEach(li => li.classList.toggle("active", Number(li.dataset.i) === index));
  if (t.file) {
    player.src = t.file;
    player.play().catch(() => {});
  } else {
    player.removeAttribute("src");
    player.load();
    embedEl.innerHTML = t.embed || `<p>No playable file. <a href="${t.url}" target="_blank" rel="noopener">Open post</a></p>`;
  }
}

player.addEventListener("ended", () => play(index + 1));
document.getElementById("prev").onclick = () => play(index - 1);
document.getElementById("next").onclick = () => play(index + 1);

loadAll().then(() => {
  statusEl.textContent = `${tracks.length} tracks`;
  renderList();
  if (tracks.length) play(0);
  else statusEl.textContent = "No audio posts found, or the blog API is blocked.";
}).catch(err => {
  statusEl.textContent = err.message + ". Open this file in a browser; Tumblr must be reachable.";
});
</script>
</body>
</html>
